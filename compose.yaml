services:
  serka:
    build:
      context: .
    image: serka-image
    ports:
      - "9000:8000"
    depends_on:
      - redis
      - mcp
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - MCP_HOST=mcp
      - FEEDBACK_LOG_PATH=/data/feedback.jsonl
    volumes:
      - ${HOME}/.aws:/root/.aws
      - ${FEEDBACK_DATA_DIR:-./feedback}:/data
    networks:
      - internal

  mcp:
    build:
      context: ./mcp-server
    image: serka-mcp-image
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ${HOME}/.aws:/root/.aws
    networks:
      - internal

  ui:
    build:
      context: ./ui
    image: serka-ui-image
    ports:
      - "8080:80"
    depends_on:
      - serka
    env_file: .env
    networks:
      - internal

  # Converts supporting files in the raw store to Markdown during ingest only:
  # docker compose --profile ingest up -d legilo
  legilo:
    profiles: ["ingest"]
    build:
      # A checkout of NERC-CEH/legilo on the supporting-docs-md branch
      context: ${LEGILO_SRC:-../legilo}
      # Legilo's own Dockerfile pins uv 0.4.2, which cannot read the branch's uv.lock;
      # these are its build steps with a current uv.
      dockerfile_inline: |
        FROM python:3.12-slim AS build
        COPY --from=ghcr.io/astral-sh/uv:0.9.3 /uv /bin/uv
        WORKDIR /app
        ENV UV_PYTHON_DOWNLOADS=never UV_COMPILE_BYTECODE=1
        COPY src/legilo/__init__.py /app/src/legilo/
        COPY pyproject.toml uv.lock /app/
        RUN uv sync --locked --no-dev --no-install-project
        COPY src /app/src
        RUN uv pip install --python=/app/.venv --no-deps .

        FROM python:3.12-slim
        WORKDIR /app
        RUN groupadd -g 999 python && useradd -m -r -u 999 -g python python
        COPY --chown=python:python --from=build /app/.venv /app/.venv
        COPY --chown=python:python --from=build /app/src/legilo/main.py /app/src/legilo/main.py
        USER python
        ENV PATH="/app/.venv/bin:$PATH" VIRTUAL_ENV="/app/.venv"
        EXPOSE 8000
        CMD ["fastapi", "run", "src/legilo/main.py", "--host", "0.0.0.0", "--port", "8000"]
    image: serka-legilo-image
    ports:
      - "${LEGILO_PORT:-8100}:8000"
    environment:
      - SUPPORTING_DOCS_DIR=/docs
      # Required by legilo at startup but unused by the documents endpoint
      - DATA_DIR=/tmp
    volumes:
      - ${RAW_DIR:-./raw}/supporting-docs:/docs:ro

  redis:
    image: redis:8.10.3
    ports:
      - "6379:6379"
    volumes:
      # A rebuildable index: default RDB snapshots, no AOF. REDIS_DATA_DIR bind-mounts a host directory instead.
      - ${REDIS_DATA_DIR:-redis-data}:/data
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  redis-data:
