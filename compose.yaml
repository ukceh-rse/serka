services:
  serka:
    build:
      context: .
    image: serka-image
    ports:
      - "9000:8000"
    depends_on:
      - redis
      - mcp
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - MCP_HOST=mcp
      - FEEDBACK_LOG_PATH=/data/feedback.jsonl
    volumes:
      - ${HOME}/.aws:/root/.aws
      - ${FEEDBACK_DATA_DIR:-./feedback}:/data
    networks:
      - internal

  mcp:
    build:
      context: ./mcp-server
    image: serka-mcp-image
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ${HOME}/.aws:/root/.aws
    networks:
      - internal

  ui:
    build:
      context: ./ui
    image: serka-ui-image
    ports:
      - "8080:80"
    depends_on:
      - serka
    env_file: .env
    networks:
      - internal

  redis:
    image: redis:8.10.3
    ports:
      - "6379:6379"
    volumes:
      # A rebuildable index: default RDB snapshots, no AOF. REDIS_DATA_DIR bind-mounts a host directory instead.
      - ${REDIS_DATA_DIR:-redis-data}:/data
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  redis-data:
